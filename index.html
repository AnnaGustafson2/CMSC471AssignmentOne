<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment One: Interactive Weather Data Visualization</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="tooltip" style="display:none"></div>
    <div class="container"> <!-- Centers content and sets max width -->
        <h1>Assignment One: Interactive Weather Data Visualization</h1>
        <div id="slider"></div>
        <div class="main">
            <div class="controls">
                <label for="weatherVariable">Attribute</label>
                <select id="weatherVariable" class="variable"></select>
                <label>Latitude Range</label>
                <div id="latSlider"></div>
                <label>Longitude Range</label>
                <div id="longSlider"></div>
            </div>
            <div id="vis"></div> <!--  Will hold our visualization (SVG) -->
        </div>
    </div>
    
    <!-- Load D3.js -->
    <script src="https://d3js.org/d3.v7.js"></script>
    <script src="https://unpkg.com/d3-simple-slider"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
    <script src="js/script.js"></script>
</body>
</html>
